name: eespl

services:
  db:
    image: postgres:16
    container_name: eespl-db
    restart: unless-stopped
    env_file: .env
    ports:
      - "5434:5432"
    volumes:
      - eespl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: eespl-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - ./data:/data:ro
      - eespl_media:/media
    depends_on:
      db:
        condition: service_healthy

  # Kylas sync: pushes queued leads (every minute) and polls lead / deal outcomes (every 5 min).
  # Same image and code as the api, another command. Sends nothing while Kylas is off.
  worker:
    build: ./backend
    container_name: eespl-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: python -m app.worker
    volumes:
      - ./backend:/app
    depends_on:
      api:
        condition: service_started

  web:
    build: ./frontend
    container_name: eespl-web
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:8000
    # node_modules lives in an anonymous volume that survives rebuilds, so sync it on start.
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

  # Phone testing over HTTPS on the office network only (camera, WebXR). Off unless asked for:
  #   LAN_IP=192.168.1.20 docker compose --profile lan-https up -d lan-https
  # Binds to the PC's LAN address only; see docs/phone-testing.md. Never port-forward it.
  lan-https:
    image: caddy:2.8
    container_name: eespl-lan-https
    profiles: ["lan-https"]
    restart: "no"
    environment:
      LAN_IP: ${LAN_IP:-127.0.0.1} # loopback unless set: nothing leaves the PC by default
    ports:
      - "${LAN_IP:-127.0.0.1}:8443:443"
      - "${LAN_IP:-127.0.0.1}:8080:80"
    volumes:
      - ./deploy/lan-https/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/lan-https:/data
    depends_on:
      - web

volumes:
  eespl_pgdata:
    name: eespl_pgdata
  # uploaded files (company logo, later documents); not in git
  eespl_media:
    name: eespl_media
