# The built app: every route of the single-page app falls back to index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
