# The built app: every route of the single-page app falls back to index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location /assets/ {
        try_files $uri =404;
    }

    # a page whose path is also a folder of the build (/assets: the Assets page) is the app too: no
    # $uri/ here, or nginx answers that folder (a 404) instead of the page
    location / {
        try_files $uri /index.html;
    }
}
