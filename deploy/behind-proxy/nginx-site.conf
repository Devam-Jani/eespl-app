# EESPL App behind the server's nginx: <domain> and training.<domain> -> 127.0.0.1:9400 (the
# eespl-test stack's Caddy, plain HTTP on the loopback only). Replace eespl.example.com with the
# real domain (3 places), copy this file to /etc/nginx/sites-available/eespl, link it into
# sites-enabled/, run `nginx -t` and reload; then `certbot --nginx -d <domain> -d training.<domain>`
# adds the 443 part and the redirect from 80. See FOR-THE-SERVER-OWNER.md.

map $http_upgrade $eespl_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name eespl.example.com training.eespl.example.com;

    # drawings (DWG, PDF): 200 MB; the app itself refuses most uploads above 60 MB
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:9400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $eespl_connection_upgrade;
        # reading a large DWG drawing can take a few minutes
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }

    # a client's BIM (IFC) model: up to 600 MB, streamed to the app instead of buffered on disk
    location ~ ^/api/sites/[^/]+/building/ifc$ {
        client_max_body_size 600m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:9400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
