[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # starlette's TestClient still references the deprecated anyio alias; harmless, fixed upstream.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
